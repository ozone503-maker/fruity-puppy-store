<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop</title>
<meta name="description" content="Shop">
<link rel="stylesheet" href="store.css">
</head>
<body>
<a class="skip" href="#shop">Skip to products</a>
<header class="fp-head">
  <a class="fp-logo" href=".">Shop</a>
  <nav>
    <a href="." data-shop-home>Shop</a>
  </nav>
</header>
<main id="shop"><p>Loading...</p></main>
<footer class="fp-foot">
  <p id="tagline"></p>
</footer>
<script>
const BASE = location.pathname.startsWith('/store') ? '/store' : '';
const params = new URLSearchParams(location.search);
function brandFromHost() {
  const h = location.hostname;
  if (h.includes('brobots')) return 'brobots';
  if (h.includes('kudoken')) return 'kudoken';
  return '';
}
const brand = params.get('brand') || brandFromHost();
const brandQ = brand ? '?brand=' + brand : '';
const homes = { brobots: 'https://brobots.space', 'brobots-tech': 'https://brobots.space', kudoken: 'https://kudoken.space' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = c => '$' + (c / 100).toFixed(2).replace(/\.00$/, '');
const imgSrc = u => /^https?:/.test(u) ? u : `${BASE}/${u}`;
const href = p => `${BASE}/product/${p.id}${brandQ}`;
const SWATCH = { White: '#f7f4f0', Carnation: '#f2a3b6', Plum: '#6b2a4a', Grey: '#9c9b9e', Black: '#211a1e' };
const buyable = p => p.variants.filter(v => v.available !== false);

function genericGrid(data, shop) {
  shop.innerHTML = '<div class="grid"></div>';
  const grid = shop.querySelector('.grid');
  data.products.forEach(p => {
    const v = p.variants[0];
    const price = v.price_cents ? '$' + (v.price_cents / 100).toFixed(2) : '$5 shipping';
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<h3><a href="${href(p)}">${esc(p.title)}</a></h3><p>${esc(p.description)}</p><p class="price">${price}</p><button class="add" data-add-sku="${esc(v.sku)}">Add to cart</button>`;
    grid.appendChild(card);
  });
}

// Big department stores (config.catalog.page_size): departments, search, one page at a time.
function deptStore(data, shop) {
  const st = data.store;
  if (st.skin) document.body.classList.add(st.skin);
  const cur = { dept: params.get('dept') || '', q: params.get('q') || '' };
  const link = o => {
    const u = new URLSearchParams();
    if (brand) u.set('brand', brand);
    for (const k of ['dept', 'q', 'page']) if (o[k] && !(k === 'page' && o[k] === 1)) u.set(k, o[k]);
    return `${BASE}/?${u}`;
  };
  const groups = [...new Set(st.departments.map(d => d.group))];
  const active = st.departments.find(d => d.id === cur.dept);
  // Phones get the groups folded shut (the active one open); wide screens show them all.
  const wide = matchMedia('(min-width:761px)').matches;
  const nav = groups.map(g => `<details class="dept-group"${wide || (active && active.group === g) ? ' open' : ''}><summary>${esc(g)}</summary><ul>${st.departments.filter(d => d.group === g).map(d =>
    `<li><a href="${link({ dept: d.id })}"${d.id === cur.dept ? ' aria-current="page"' : ''}>${esc(d.name)} <span>${d.count}</span></a></li>`).join('')}</ul></details>`).join('');
  const card = p => {
    const vs = buyable(p);
    const v = vs[0];
    if (!v) return '';
    const from = vs.some(x => x.price_cents !== v.price_cents) ? 'From ' : '';
    const low = Math.min(...vs.map(x => x.price_cents));
    const img = p.images[0] ? `<img src="${esc(imgSrc(p.images[0]))}" alt="${esc(p.title)}" loading="lazy" width="400" height="400">` : '';
    return `<article class="dept-card"><a class="dept-photo" href="${href(p)}">${img}</a>
      <h3><a href="${href(p)}">${esc(p.title)}</a></h3>
      <p class="dept-price">${from}${money(low)}</p>
      ${vs.length > 1 ? `<a class="add" href="${href(p)}">Choose options</a>` : `<button class="add" type="button" data-add-sku="${esc(v.sku)}">Add to cart</button>`}</article>`;
  };
  const heading = cur.q ? `Results for “${esc(cur.q)}”` : active ? esc(active.name) : 'Everything';
  const pager = data.pages > 1 ? `<nav class="pager" aria-label="Pages">
    ${data.page > 1 ? `<a href="${link({ ...cur, page: data.page - 1 })}">Back</a>` : '<span></span>'}
    <span>Page ${data.page} of ${data.pages}</span>
    ${data.page < data.pages ? `<a href="${link({ ...cur, page: data.page + 1 })}">Next</a>` : '<span></span>'}</nav>` : '';
  shop.innerHTML = `
  <section class="dept-top">
    <h1>${esc(st.name)}</h1>
    <p>${esc(st.tagline || '')}</p>
    <form class="dept-search" role="search" action="${BASE}/">
      ${brand ? `<input type="hidden" name="brand" value="${esc(brand)}">` : ''}
      <label class="sr" for="q">Search the store</label>
      <input id="q" name="q" type="search" value="${esc(cur.q)}" placeholder="Search ${st.total} products">
      <button type="submit">Search</button>
    </form>
  </section>
  ${st.total ? `<div class="dept-layout">
    <aside class="dept-nav" aria-label="Departments"><a class="dept-all" href="${link({})}"${!cur.dept && !cur.q ? ' aria-current="page"' : ''}>Everything <span>${st.total}</span></a>${nav}</aside>
    <section class="dept-main" aria-labelledby="dept-h">
      <h2 id="dept-h">${heading} <small>${data.matches} ${data.matches === 1 ? 'product' : 'products'}</small></h2>
      ${data.products.length ? `<div class="dept-grid">${data.products.map(card).join('')}</div>` : '<p>Nothing matched. Try another word or pick a department.</p>'}
      ${pager}
      ${st.shipping_note ? `<p class="dept-ship">${esc(st.shipping_note)}</p>` : ''}
    </section>
  </div>` : '<p class="dept-empty">The shelves are being stocked. Check back soon.</p>'}`;
  window.__pageProducts = data.products;
}

function merchCard(p) {
  const vs = buyable(p);
  const v = vs[0];
  const chips = vs.map((x, i) => `<label class="chip" title="${esc(x.title)}"><input type="radio" name="c-${esc(p.id)}" value="${esc(x.sku)}" ${i ? '' : 'checked'}><span style="--sw:${SWATCH[x.title] || '#ccc'}"></span><b class="sr">${esc(x.title)}</b></label>`).join('');
  return `<article class="rack-item" data-id="${esc(p.id)}">
    <a class="rack-photo" href="${href(p)}"><img src="${esc(imgSrc(p.images[0]))}" alt="Ipo wearing the ${esc(p.title)}" loading="lazy" width="496" height="992"></a>
    <div class="rack-info">
      <h3><a href="${href(p)}">${esc(p.title.replace(/^Fruity Puppy /, ''))}</a></h3>
      <p class="rack-price">${money(v.price_cents)}</p>
    </div>
    <fieldset class="chips"><legend class="sr">Color</legend>${chips}</fieldset>
    <button class="buy" type="button" data-add-sku="${esc(v.sku)}">Add to cart</button>
  </article>`;
}

function jarCard(p) {
  const vs = buyable(p);
  const img = p.images[0] ? `<img src="${esc(imgSrc(p.images[0]))}" alt="${esc(p.id === 'free-sample' ? 'A real Fruity Puppy sample jar held between two fingers' : p.title)}" loading="lazy">` : '<div class="jar-blank" aria-hidden="true"></div>';
  if (!vs.length) return `<li class="jar out"><a href="${href(p)}">${img}<span class="jar-name">${esc(p.title)}</span></a><span class="stock-out">Out of stock</span></li>`;
  const v = vs[0];
  const price = v.price_cents ? money(v.price_cents) : 'Free, $5 shipping';
  return `<li class="jar"><a href="${href(p)}">${img}<span class="jar-name">${esc(p.title)}</span></a><span class="jar-price">${price}</span><button class="buy" type="button" data-add-sku="${esc(v.sku)}">Add to cart</button></li>`;
}

function logoCard(p) {
  const colors = [...new Set(p.variants.map(v => v.title.split(' / ')[0]))].join(', ');
  const sizes = p.size_chart ? p.size_chart.rows.map(r => r[0]).join(', ') : '';
  const who = p.model ? `${p.model} wearing the ${p.title}` : `The ${p.title}, laid flat`;
  const live = !p.draft && p.variants.some(v => v.available);
  return `<li class="logo-item"><a href="${href(p)}"><img src="${esc(imgSrc(p.images[0]))}" alt="${esc(who)}" loading="lazy" width="360" height="${p.model ? 640 : 480}"></a>
    <h4><a href="${href(p)}">${esc(p.title.replace(p.logo + ' ', ''))}</a></h4>
    <p class="logo-price">${money(p.variants[0].price_cents)} ${live ? '' : '<span class="soon">Coming soon</span>'}</p>
    <p class="logo-var">${esc(colors)}${sizes ? `<br>${esc(sizes)}` : ''}</p>
    ${live ? `<a class="buy logo-buy" href="${href(p)}">Pick size and color</a>` : ''}</li>`;
}

function logoSection(items) {
  const groups = [...new Set(items.map(p => p.logo))];
  return `<section class="logos" aria-labelledby="logos-h">
    <h2 id="logos-h">The label collection</h2>
    <p class="logos-sub">Our jar labels, made wearable. Printed to order and shipped from the US. Beach hoodies and blankets are coming soon.</p>
    ${groups.map(g => `<details class="logo-group"${g === groups[0] ? ' open' : ''}><summary>${esc(g)}</summary><ul class="logo-row">${items.filter(p => p.logo === g).map(logoCard).join('')}</ul></details>`).join('')}
  </section>`;
}

function fruityPuppy(data, shop) {
  document.body.classList.add('fp');
  const merch = data.products.filter(p => p.collection === 'Standard' && p.images.length);
  const skin = data.products.filter(p => p.collection !== 'Standard' && p.collection !== 'Logo');
  const logoDrafts = data.products.filter(p => p.collection === 'Logo' && p.images.length);
  const inStock = skin.filter(p => buyable(p).length);
  const out = skin.filter(p => !buyable(p).length);
  shop.innerHTML = `
  <section class="topbuy" aria-labelledby="top-h">
    <h1 id="top-h" class="top-h">Fruity Puppy cream<br>fresh from the fridge</h1>
    <p class="fridge-sub">Fresh fruit skin nutrition from Hawaiʻi.</p>
    <ul class="jars top">${inStock.map(jarCard).join('')}</ul>
  </section>
  <section class="runway" aria-labelledby="runway-h">
    <h2 id="runway-h" class="runway-h">Ipo wears it first<br>you wear it next</h2>
    <p class="runway-sub">Soft goods from Fruity Puppy, modeled by the pink poodle herself.</p>
    <ol class="runway-strip">${merch.map(p => `<li><a href="${href(p)}"><img src="${esc(imgSrc(p.images[0]))}" alt="Ipo wearing the ${esc(p.title)}" width="496" height="992" ${merch.indexOf(p) < 3 ? 'fetchpriority="high"' : 'loading="lazy"'}><span>${esc(p.title.replace(/^Fruity Puppy /, ''))}</span></a></li>`).join('')}</ol>
  </section>
  <section class="rack" aria-labelledby="rack-h">
    <h2 id="rack-h">The rack</h2>
    <div class="rack-grid">${merch.map(merchCard).join('')}</div>
  </section>
  ${logoDrafts.length ? logoSection(logoDrafts) : ''}
  ${out.length ? `<section class="fridge" aria-labelledby="fridge-h">
    <h2 id="fridge-h">More from the fridge</h2>
    <p class="fridge-sub">Out of stock right now</p>
    <ul class="jars small">${out.map(jarCard).join('')}</ul>
  </section>` : ''}
  <figure class="outlet">
    <img src="${BASE}/img/ipo-erv-fitting-room-outlet.jpg" alt="Ipo on a fitting room bench holding a yellow top, Erv standing beside her" loading="lazy" width="620" height="775">
    <figcaption>Ipo and Erv, deep in a fitting room decision</figcaption>
  </figure>`;
  shop.addEventListener('change', e => {
    if (e.target.matches('.chips input')) {
      const card = e.target.closest('.rack-item');
      card.querySelector('.buy').dataset.addSku = e.target.value;
    }
  });
}

const listQ = (() => {
  const u = new URLSearchParams();
  if (brand) u.set('brand', brand);
  for (const k of ['dept', 'q', 'page']) if (params.get(k)) u.set(k, params.get(k));
  const t = u.toString();
  return t ? '?' + t : '';
})();
fetch(BASE + '/api/catalog' + listQ).then(r => r.json()).then(data => {
  if (data.store && data.store.name) document.title = data.store.name;
  const logo = document.querySelector('.fp-logo');
  if (logo && data.store) logo.textContent = data.store.name;
  const tag = document.getElementById('tagline');
  if (tag && data.store) tag.textContent = data.store.tagline || '';
  const home = homes[brand] || 'https://fruitypuppy.com';
  const foot = document.querySelector('.fp-foot');
  if (foot && brand) foot.innerHTML = `<p>${esc(data.store?.tagline)}</p><p><a href="${home}">${home.replace('https://', '')}</a></p>`;
  const shop = document.getElementById('shop');
  if (data.store && data.store.paged) deptStore(data, shop); else if (brand) genericGrid(data, shop); else fruityPuppy(data, shop);
}).catch(() => { document.getElementById('shop').textContent = 'The shop did not load. Refresh the page to try again.'; });
</script>
<script src="cart.js" defer></script>
</body></html>
